<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>调度台 · 登录</title>
<style>
:root{--bg:#0d1017;--card:#151a24;--line:#263044;--text:#e8ecf3;--sub:#93a0b5;--mute:#5f6b80;--ok:#34c38f;--bad:#ef5b5b;--accent:#5b9dff;--on-accent:#06162e}
@media (prefers-color-scheme: light){:root{--bg:#f4f5f7;--card:#fff;--line:#dde1e8;--text:#161a22;--sub:#566176;--mute:#8a94a6;--ok:#12805c;--bad:#c23434;--accent:#1f6fe0;--on-accent:#fff}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,"Microsoft YaHei",sans-serif;display:flex;align-items:center;justify-content:center;padding:16px}
.box{width:100%;max-width:340px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px 24px 24px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--ok)}
h1{font-size:20px;font-weight:600;margin:0}
p{margin:0 0 20px;color:var(--sub);font-size:13px}
label{display:block;font-size:13px;color:var(--sub);margin-bottom:6px}
input{width:100%;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);padding:0 12px;font:inherit;outline:none}
input:focus{border-color:var(--accent)}
button{width:100%;height:44px;margin-top:14px;border:0;border-radius:10px;background:var(--accent);color:var(--on-accent);font:inherit;font-weight:600;cursor:pointer}
button:hover{filter:brightness(1.08)}
.err{color:var(--bad);font-size:13px;min-height:20px;margin-top:8px}
/* 科技感主题（和首页一致）） */
:root{color-scheme:dark;--bg:#050b16;--card:#0a1728;--line:#1c3552;--text:#e6f2ff;--sub:#8fb2d4;--mute:#56738f;--ok:#2ee6a6;--bad:#ff4d6d;--accent:#2de2ff;--on-accent:#03121c}
html{background:var(--bg)}
body{background:radial-gradient(70% 50% at 50% 40%,rgba(45,226,255,.12),transparent 70%),linear-gradient(rgba(45,226,255,.04) 1px,transparent 1px) 0 0/48px 48px,linear-gradient(90deg,rgba(45,226,255,.04) 1px,transparent 1px) 0 0/48px 48px}
.box{border-radius:8px;border-color:rgba(45,226,255,.35);background:linear-gradient(165deg,#10243f,#081322);box-shadow:0 0 0 1px rgba(45,226,255,.06),0 0 40px rgba(45,226,255,.14),0 24px 70px rgba(0,0,0,.6)}
.brand .dot{width:9px;height:9px;border-radius:0;transform:rotate(45deg);background:var(--accent);box-shadow:0 0 12px var(--accent)}
h1{font-family:"Bahnschrift","DIN Alternate","Segoe UI",system-ui,"Microsoft YaHei",sans-serif;letter-spacing:.18em;color:#fff;text-shadow:0 0 16px rgba(45,226,255,.65)}
p{letter-spacing:.12em;color:var(--mute)}
input{border-radius:4px;background:rgba(5,11,22,.8)}
input:focus{box-shadow:0 0 0 3px rgba(45,226,255,.18)}
button{border-radius:4px;letter-spacing:.4em;box-shadow:0 0 18px rgba(45,226,255,.3)}
</style>
</head>
<body>
<form class="box" method="post" action="/login">
  <div class="brand"><span class="dot"></span><h1>调度台</h1></div>
  <p>网站与服务器监控</p>
  <label for="pw">访问密码</label>
  <input id="pw" name="password" type="password" autocomplete="current-password" autofocus required>
  <div class="err" id="err" role="alert"></div>
  <button type="submit">进入</button>
</form>
<script>
const e = new URLSearchParams(location.search).get('e');
if (e === 'wrong') document.getElementById('err').textContent = '密码不对，再试一次。';
if (e === 'wait') document.getElementById('err').textContent = '尝试太频繁，请等一分钟再试。';
</script>
</body>
</html>
