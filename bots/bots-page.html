<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bot</title>
<style>
:root{--bg:#0d1017;--card:#151a24;--card2:#1a2130;--line:#263044;--text:#e8ecf3;--sub:#93a0b5;--mute:#5f6b80;--bad:#ef5b5b;--ok:#34c38f;--warn:#f0a53a;--run:#5b9dff;--bot:#22d3ee}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 system-ui,"Microsoft YaHei",sans-serif;overflow:hidden}
button{background:transparent;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--sub)}
button.pri{background:var(--bot);border-color:var(--bot);color:#04222a;font-weight:600}
button.danger:hover{border-color:var(--bad);color:var(--bad)}
button:disabled{opacity:.5;cursor:default}
.app{display:grid;grid-template-columns:230px minmax(0,1fr);height:100%}
.app.desk{grid-template-columns:230px minmax(320px,1fr) minmax(0,1.25fr)}
/* 左：Bot 列表 */
.side{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side .top{padding:10px 12px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.side .top b{font-weight:600}
.side .top button{margin-left:auto}
.list{overflow:auto;flex:1;padding:6px}
.bot{padding:9px 10px;border-radius:10px;cursor:pointer;border:1px solid transparent;margin-bottom:4px}
.bot:hover{background:var(--card)}
.bot.on{background:var(--card);border-color:var(--bot)}
.bot .n{display:flex;align-items:center;gap:7px;font-weight:600}
.bot .n span.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bot .m{font-size:12px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bot .p{font-size:12px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--mute)}
.dot.idle{background:var(--ok)}.dot.run{background:var(--run);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
.pc{padding:8px 12px;border-top:1px solid var(--line);font-size:12px;color:var(--sub);display:flex;align-items:center;gap:7px}
/* 中：对话 */
.chat{display:flex;flex-direction:column;min-width:0;min-height:0}
.head{padding:8px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.head b{font-size:15px}
.head .model{font-size:12px;color:var(--bot);border:1px solid var(--bot);border-radius:6px;padding:0 7px}
.head .sp{flex:1}
.msgs{flex:1;overflow:auto;padding:14px 16px 6px}
.msgs .inner{max-width:860px;margin:0 auto}
.u{display:flex;justify-content:flex-end;margin:12px 0}
.u div{background:#22304d;border-radius:14px 14px 4px 14px;padding:8px 13px;max-width:85%;white-space:pre-wrap;overflow-wrap:anywhere}
.a{margin:10px 0;overflow-wrap:anywhere}
.a.err{color:var(--warn)}
.a p{margin:6px 0}.a ul,.a ol{margin:6px 0;padding-left:22px}.a h1,.a h2,.a h3{font-size:15px;margin:12px 0 4px}
.a a{color:var(--run)}
.a code{background:var(--card2);border-radius:4px;padding:1px 5px;font:12.5px ui-monospace,Consolas,monospace}
.a pre{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;overflow:auto}
.a pre code{background:none;padding:0}
.a table{border-collapse:collapse;margin:8px 0}.a td,.a th{border:1px solid var(--line);padding:4px 9px}
.say{color:var(--sub);font-size:13px;margin:8px 0 2px}
.step{border:1px solid var(--line);border-radius:9px;margin:4px 0;background:var(--card);font-size:13px}
.step summary{list-style:none;cursor:pointer;padding:6px 10px;display:flex;gap:8px;align-items:center}
.step summary::-webkit-details-marker{display:none}
.step .tn{color:var(--bot);font-family:ui-monospace,Consolas,monospace;font-size:12.5px;flex:none}
.step .ta{color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.step .st{flex:none;font-size:12px;color:var(--ok)}.step .st.bad{color:var(--bad)}.step .st.wait{color:var(--run)}
.step pre{margin:0;border-top:1px solid var(--line);padding:8px 10px;white-space:pre-wrap;word-break:break-word;font:12px/1.55 ui-monospace,Consolas,monospace;color:var(--sub);max-height:300px;overflow:auto}
.sub{border:1px solid color-mix(in srgb,var(--pur,#b48cff) 55%,transparent);border-radius:12px;padding:10px 14px;margin:8px 0;background:color-mix(in srgb,var(--pur,#b48cff) 7%,transparent)}
.sub .sh{font-weight:600;font-size:13px;color:var(--pur,#b48cff);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sub .sh small{font-weight:400;color:var(--sub,#93a0b5)}
.sub details{font-size:12px;color:var(--sub,#93a0b5);margin:6px 0}
.sub details pre{white-space:pre-wrap;margin:6px 0 0}
.sub .ss{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.sub .ss span{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:0 7px;color:var(--sub,#93a0b5);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub .ss span.bad{color:var(--bad,#ef5b5b)}
.sub .sr{margin-top:6px}
.shot.pic{max-width:min(640px,100%);width:auto;max-height:520px;background:#fff}
.shot{display:block;max-width:360px;width:100%;border:1px solid var(--line);border-radius:8px;margin:6px 0;cursor:zoom-in}
.file{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--bot);border-radius:10px;padding:7px 12px;margin:6px 0;color:var(--text);text-decoration:none;background:rgba(34,211,238,.08)}
.file small{color:var(--sub)}
.note{text-align:center;color:var(--mute);font-size:12px;margin:8px 0}
.hello{color:var(--sub);text-align:center;margin-top:8vh}
.hello h3{color:var(--text);font-weight:600;font-size:17px;margin:0 0 6px}
.hello .eg{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.hello .eg button{white-space:normal;text-align:left;max-width:300px;color:var(--sub)}
.status{max-width:860px;margin:0 auto;padding:0 16px;font-size:12px;color:var(--run);min-height:20px;width:100%}
.box{padding:6px 16px 12px}
.box .in{max-width:860px;margin:0 auto;display:flex;gap:8px;align-items:flex-end;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 8px 8px 14px}
.box .in:focus-within{border-color:var(--bot)}
textarea{flex:1;background:transparent;color:var(--text);border:0;outline:0;resize:none;font:inherit;max-height:160px;min-height:24px;padding:3px 0}
/* 右：桌面 */
.deskp{border-left:1px solid var(--line);display:flex;flex-direction:column;min-width:0;min-height:0}
.deskp .head{font-size:13px;color:var(--sub)}
.deskp iframe{flex:1;border:0;background:#000;width:100%;min-height:0}
dialog{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:16px;padding:0;width:min(560px,94vw)}
dialog::backdrop{background:rgba(0,0,0,.6)}
.dl{padding:18px 20px;display:grid;gap:12px}
.dl h3{margin:0;font-size:16px}
.dl label{display:grid;gap:4px;font-size:13px;color:var(--sub)}
.dl input,.dl select,.dl textarea{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:inherit;outline:none;width:100%}
.dl textarea{min-height:110px;max-height:none;resize:vertical}
.dl .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dl .row .sp{flex:1}
#dErr{color:var(--bad);font-size:13px}
#zoom{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:9;cursor:zoom-out}
#zoom img{max-width:96vw;max-height:96vh}
@media (max-width:820px){.app,.app.desk{grid-template-columns:1fr}.side{display:none}.app.desk .chat{display:none}}
/* 科技感主题（和首页一致）：固定深色，只改配色和细节，不改布局。 */
:root{color-scheme:dark;--bg:#050b16;--card:#0a1728;--card2:#0e2038;--line:#1c3552;--text:#e6f2ff;--sub:#8fb2d4;--mute:#56738f;--ok:#2ee6a6;--warn:#ffb020;--bad:#ff4d6d;--run:#2de2ff}
html{background:var(--bg)}
body{background-color:var(--bg);background-image:linear-gradient(rgba(45,226,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(45,226,255,.035) 1px,transparent 1px);background-size:48px 48px;background-attachment:fixed}
button,input,textarea,select{border-radius:4px}
::selection{background:rgba(45,226,255,.3)}
*{scrollbar-color:#24507f transparent}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="side">
    <div class="top"><b>Bot</b><button id="newBot">＋ 新建</button></div>
    <div class="list" id="list"></div>
    <div class="pc"><span class="dot" id="pcDot"></span><span id="pcText">Bot 的电脑：检查中…</span></div>
  </aside>
  <main class="chat">
    <div class="head"><b id="hName">…</b><span class="model" id="hModel"></span><span class="sp"></span>
      <button id="bDesk">看它的屏幕</button><button id="bExt">扩展</button><button id="bSet">设置</button><button id="bClear" class="danger">清空对话</button></div>
    <div class="msgs" id="msgs"><div class="inner" id="inner"></div></div>
    <div class="status" id="status"></div>
    <div class="box"><div class="in"><textarea id="text" rows="1" placeholder="给它一个任务，回车发送，Shift+回车换行"></textarea><button id="stop" class="danger" hidden>停止</button><button id="send" class="pri">发送</button></div></div>
  </main>
  <section class="deskp" id="deskp" hidden>
    <div class="head"><span>Bot 的电脑 · 实时画面（可以直接用鼠标键盘操作）</span><span class="sp"></span><a href="/desk/vnc.html?autoconnect=1&resize=scale&reconnect=1&bell=off&path=desk/websockify" target="_blank" rel="noopener" style="color:var(--run);font-size:12px">新窗口打开</a><button id="deskClose">收起</button></div>
    <iframe id="desk" title="Bot 的桌面" allow="clipboard-read; clipboard-write"></iframe>
  </section>
</div>
<dialog id="dlg"><form class="dl" id="form" method="dialog">
  <h3 id="dTitle">新建 Bot</h3>
  <label>名字<input id="fName" maxlength="30" autocomplete="off" placeholder="比如：调研员、写手、程序员"></label>
  <label>模型<select id="fModel"></select></label>
  <label>它是谁、擅长什么、要注意什么（可以留空）<textarea id="fPersona" maxlength="2000" placeholder="比如：你是一个严谨的调研员，擅长查资料、对比信息来源，结论一定附上出处。"></textarea></label>
  <div class="row"><button type="button" class="danger" id="dDel" hidden>删除这个 Bot</button><button type="button" id="dMem" hidden>清空它的长期记忆</button><span class="sp"></span><span id="dErr"></span><button type="button" id="dCancel">取消</button><button type="submit" class="pri">保存</button></div>
</form></dialog>
<div id="zoom" hidden><img alt=""></div>
<!--EXT-UI-->
<script>
const API = '/bots/api';
const DESK_URL = '/desk/vnc.html?autoconnect=1&resize=scale&reconnect=1&bell=off&path=desk/websockify';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = { get: (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* 存不了就算了 */ } } };
let bots = [], models = [], cur = new URLSearchParams(location.search).get('bot') || store.get('bot') || '', msgs = [], since = 0, running = false, editing = null, timer = null;

async function call(method, path, body) {
  const res = await fetch(API + path, { method, headers: body ? { 'X-Bots-Action': '1', 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined });
  const j = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(j.error || '请求失败（' + res.status + '）');
  return j;
}
// ---- 简单的 Markdown（先转义，再处理代码块、标题、列表、表格、粗体、链接） ----
const IMG_EXT = /\.(png|jpe?g|gif|webp)$/i;
const unesc = (s) => s.replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&#39;/g, "'");
const delivered = new Set();
const baseName = (p) => unesc(p).split('/').pop();
const localImg = (p, alt) => delivered.has(baseName(p)) ? '' : '<img class="shot pic" loading="lazy" alt="' + alt + '" src="' + esc(fileUrl(unesc(p), true)) + '">';
const localFile = (p, text) => IMG_EXT.test(p) ? localImg(p, text) : '<a class="file" href="' + esc(fileUrl(unesc(p))) + '" download>⬇ ' + text + '</a>';
function inline(s) {
  s = s.replace(/!\[([^\]]*)\]\((?:sandbox:)?([^)\s]+)\)/g, (m, alt, u) => /^https?:\/\//.test(u) ? '<img class="shot pic" loading="lazy" referrerpolicy="no-referrer" alt="' + alt + '" src="' + u + '">' : localImg(u, alt))
    .replace(/\[([^\]]+)\]\((?:sandbox:)?(\/[^)\s]+|[^)\s:]+\.[A-Za-z0-9]{1,6})\)/g, (m, t, u) => localFile(u, t));
  return s.replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
    .replace(/(^|[\s（(：:，,])(https?:\/\/[^\s<）)，,。]+)/g, '$1<a href="$2" target="_blank" rel="noopener noreferrer">$2</a>');
}
function md(text) {
  const blocks = [];
  let s = esc(text).replace(/```[^\n]*\n([\s\S]*?)```/g, (m, c) => { blocks.push('<pre><code>' + c.replace(/\n$/, '') + '</code></pre>'); return '\u0000' + (blocks.length - 1) + '\u0000'; });
  const out = [];
  let listTag = '', para = [], table = [];
  const flush = () => { if (para.length) { out.push('<p>' + para.map(inline).join('<br>') + '</p>'); para = []; } if (listTag) { out.push('</' + listTag + '>'); listTag = ''; }
    if (table.length) { out.push('<table>' + table.filter((r) => !/^\s*\|?[\s:|-]+\|?\s*$/.test(r)).map((r, i) => '<tr>' + r.replace(/^\s*\||\|\s*$/g, '').split('|').map((c) => (i ? '<td>' : '<th>') + inline(c.trim()) + (i ? '</td>' : '</th>')).join('') + '</tr>').join('') + '</table>'); table = []; } };
  for (const line of s.split('\n')) {
    let m;
    if (/^\u0000\d+\u0000$/.test(line.trim())) { flush(); out.push(blocks[Number(line.trim().slice(1, -1))]); }
    else if ((m = /^(#{1,4})\s+(.*)$/.exec(line))) { flush(); out.push('<h3>' + inline(m[2]) + '</h3>'); }
    else if ((m = /^\s*([-*•]|\d+[.)、])\s+(.*)$/.exec(line))) { const t = /\d/.test(m[1]) ? 'ol' : 'ul'; if (para.length || table.length || (listTag && listTag !== t)) flush(); if (!listTag) { listTag = t; out.push('<' + t + '>'); } out.push('<li>' + inline(m[2]) + '</li>'); }
    else if (/^\s*\|.*\|\s*$/.test(line)) { if (para.length || listTag) flush(); table.push(line); }
    else if (!line.trim()) flush();
    else { if (listTag || table.length) flush(); para.push(line); }
  }
  flush();
  return out.join('');
}
const argLine = (c) => { const a = c.args || {}; return String(a.url || a.query || a.command || a.path || a.text || a.key || a.direction || (a.index !== undefined ? '编号 ' + a.index + (a.text ? ' ← ' + a.text : '') : '') || (a.x !== undefined ? a.x + ', ' + a.y : '') || '').replace(/\s+/g, ' ').slice(0, 140); };
const TOOL_NAME = { web_search: '搜索', web_fetch: '读网页', web_render: '渲染读网页', browser_open: '打开网页', browser_read: '看网页', browser_click: '点击', browser_type: '输入', browser_select: '选择', browser_key: '按键', browser_scroll: '滚动', browser_back: '后退',
  browser_screenshot: '网页截图', desktop_screenshot: '桌面截图', desktop_click: '点桌面', desktop_type: '桌面输入', desktop_key: '桌面按键', shell: '运行命令', write_file: '写文件', read_file: '读文件', list_files: '看文件夹', deliver: '交付文件', publish: '发布到网上', subagent: '子代理', request_extension: '申请扩展', skill_read: '读技能', mcp_tools: '看 MCP 工具', mcp_call: '调用 MCP', remember: '记住', wait: '等待' };
const MODEL_NAMES = { 'deepseek-v4.1-flash-abliterated': 'deepseek-v4.1-flash' };   // 模型的显示名：只改界面上看到的名字，实际调用的模型不变
const showModel = (id) => MODEL_NAMES[id] || id || '';
const fileUrl = (p, inlineImg) => API + '/file?bot=' + encodeURIComponent(cur) + '&path=' + encodeURIComponent(p) + (inlineImg ? '&inline=1' : '');
const size = (n) => n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : n > 1024 ? (n / 1024).toFixed(0) + ' KB' : n + ' 字节';
function paintMsgs(keepScroll) {
  const box = $('msgs'), atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
  const results = new Map();
  for (const m of msgs) if (m.role === 'tool') results.set(m.callId || 'i' + m.id, m);
  const open = new Set([...document.querySelectorAll('.step[open]')].map((d) => d.dataset.k));
  delivered.clear();
  for (const m of msgs) if (m.role === 'tool' && m.file && IMG_EXT.test(m.file.name)) delivered.add(m.file.name);
  let html = '';
  for (const m of msgs) {
    if (m.role === 'user') html += '<div class="u"><div>' + esc(m.text) + '</div></div>';
    else if (m.role === 'note') html += '<div class="note">' + esc(m.text) + '</div>';
    else if (m.role === 'assistant') {
      if (m.calls && m.calls.length) {
        if (m.text) html += '<div class="say">' + esc(m.text) + '</div>';
        for (const c of m.calls) {
          const r = results.get(c.id), k = m.id + ':' + c.id;
          html += '<details class="step" data-k="' + esc(k) + '"' + (open.has(k) ? ' open' : '') + '><summary><span class="tn">' + esc(TOOL_NAME[c.name] || c.name) + '</span><span class="ta">' + esc(argLine(c)) + '</span>'
            + '<span class="st ' + (!r ? 'wait' : r.ok ? '' : 'bad') + '">' + (!r ? '进行中…' : r.ok ? '完成' : '失败') + '</span></summary><pre>' + esc(JSON.stringify(c.args, null, 1)) + (r ? '\n────────\n' + esc(r.text) : '') + '</pre></details>';
          if (r && r.image) html += '<img class="shot" loading="lazy" alt="截图" src="' + esc(fileUrl(r.image, true)) + '">';
          if (r && r.file && IMG_EXT.test(r.file.name)) html += '<img class="shot pic" loading="lazy" alt="' + esc(r.file.name) + '" src="' + esc(fileUrl(r.file.path, true)) + '">';
          if (r && r.sub) html += '<div class="sub"><div class="sh">子代理的回复<small>' + esc(showModel(r.sub.model)) + (r.sub.role ? ' · ' + esc(r.sub.role) : '') + ' · 独立做了 ' + r.sub.steps.length + ' 步</small></div>'
            + '<details><summary>交给它的任务（它只看得到这段话）</summary><pre>' + esc(r.sub.task) + '</pre></details>'
            + (r.sub.steps.length ? '<div class="ss">' + r.sub.steps.map((s) => '<span class="' + (s.ok ? '' : 'bad') + '" title="' + esc(s.arg) + '">' + esc(TOOL_NAME[s.name] || s.name) + (s.arg ? '：' + esc(s.arg.slice(0, 40)) : '') + '</span>').join('') + '</div>' : '')
            + '<div class="sr">' + md(r.sub.report) + '</div></div>';
          if (r && r.ext) html += extCard(r.ext);
          if (r && r.link) html += '<div><a class="file" href="' + esc(r.link.url) + '" target="_blank" rel="noopener noreferrer">🔗 ' + esc(r.link.url) + '</a></div>';
          if (r && r.file) html += '<div><a class="file" href="' + esc(fileUrl(r.file.path)) + '" download="' + esc(r.file.name) + '">⬇ ' + esc(r.file.name) + ' <small>' + size(r.file.size) + '</small></a></div>';
        }
      } else html += '<div class="a' + (m.error ? ' err' : '') + '">' + md(m.text || '') + '</div>';
    }
  }
  const b = bots.find((x) => x.id === cur);
  if (!msgs.length) html = '<div class="hello"><h3>' + esc(b ? b.name : 'Bot') + ' 已就绪</h3>它有一台自己的电脑：能搜索、开浏览器、点网页、跑命令、写文件，做完把成果交给你。<div class="eg">'
    + ['调研一下最近一周 AI 领域最重要的 3 条新闻，每条给出来源链接，整理成一份 Markdown 简报交给我', '打开 news.ycombinator.com，把首页前 10 条的标题和链接做成一个表格', '用 Python 画一张正弦曲线图，保存成 PNG 交给我'].map((t) => '<button data-eg="' + esc(t) + '">' + esc(t) + '</button>').join('') + '</div></div>';
  $('inner').innerHTML = html;
  if (!keepScroll || atBottom) box.scrollTop = box.scrollHeight;
}
function paintHead() {
  const b = bots.find((x) => x.id === cur);
  $('hName').textContent = b ? b.name : '还没有 Bot';
  $('hModel').textContent = b ? showModel(b.model) : ''; $('hModel').hidden = !b;
  for (const id of ['bSet', 'bClear', 'send']) $(id).disabled = !b;
  $('stop').hidden = !running; $('send').hidden = running;
}
function paintList() {
  $('list').innerHTML = bots.map((b) => '<div class="bot' + (b.id === cur ? ' on' : '') + '" data-id="' + b.id + '"><div class="n"><span class="dot ' + (b.running ? 'run' : 'idle') + '"></span><span class="nm">' + esc(b.name) + '</span></div>'
    + '<div class="m">' + esc(showModel(b.model)) + '</div><div class="p">' + esc(b.running ? b.status : b.preview || '还没有对话') + '</div></div>').join('') || '<div class="note">还没有 Bot，点右上角"新建"</div>';
}
async function loadState() {
  try {
    const d = await call('GET', '/state');
    bots = d.bots;
    if (!bots.some((b) => b.id === cur)) { cur = bots.length ? bots[0].id : ''; msgs = []; since = 0; if (cur) loadChat(true); }
    $('pcDot').className = 'dot ' + (d.computer.ok ? 'idle' : ''); $('pcDot').style.background = d.computer.ok === false ? 'var(--bad)' : '';
    $('pcText').textContent = d.computer.ok ? 'Bot 的电脑在线' + (d.computer.browser ? ' · 浏览器已就绪' : ' · 浏览器启动中') : 'Bot 的电脑连不上';
    paintList(); paintHead();
  } catch (e) { $('pcText').textContent = e.message; }
}
async function loadChat(reset) {
  if (!cur) { msgs = []; paintMsgs(); return; }
  const bot = cur;
  try {
    const d = await call('GET', '/chat?bot=' + bot + '&since=' + (reset ? 0 : since));
    if (bot !== cur) return;
    if (reset) msgs = [];
    if (d.messages.length || reset) { msgs = msgs.concat(d.messages); since = msgs.length ? msgs[msgs.length - 1].id : 0; paintMsgs(!reset); }
    running = d.running;
    $('status').textContent = d.running ? d.status : '';
    paintHead();
  } catch (e) { $('status').textContent = e.message; }
  clearTimeout(timer);
  timer = setTimeout(() => loadChat(false), running ? 1200 : 4000);
}
function pick(id) { cur = id; store.set('bot', id); msgs = []; since = 0; running = false; paintList(); paintHead(); loadChat(true); }
$('list').addEventListener('click', (e) => { const b = e.target.closest('.bot'); if (b && b.dataset.id !== cur) pick(b.dataset.id); });
async function send() {
  const text = $('text').value.trim();
  if (!text || !cur || running) return;
  $('send').disabled = true;
  try { await call('POST', '/send', { bot: cur, text }); $('text').value = ''; grow(); running = true; paintHead(); await loadChat(false); loadState(); }
  catch (e) { $('status').textContent = e.message; }
  $('send').disabled = false;
}
const grow = () => { const t = $('text'); t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 160) + 'px'; };
$('text').addEventListener('input', grow);
$('text').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); } });
$('send').onclick = send;
$('stop').onclick = async () => { try { await call('POST', '/stop', { bot: cur }); } catch (e) { $('status').textContent = e.message; } };
$('bClear').onclick = async () => { if (!confirm('清空和这个 Bot 的全部对话？（它的长期记忆和文件不会删）')) return; try { await call('POST', '/clear', { bot: cur }); pick(cur); loadState(); } catch (e) { $('status').textContent = e.message; } };
$('inner').addEventListener('click', (e) => {
  const eg = e.target.closest('[data-eg]'); if (eg) { $('text').value = eg.dataset.eg; grow(); $('text').focus(); return; }
  if (e.target.classList.contains('shot')) { $('zoom').querySelector('img').src = e.target.src; $('zoom').hidden = false; }
});
$('zoom').onclick = () => { $('zoom').hidden = true; };
// ---- 桌面 ----
function desk(show) {
  $('deskp').hidden = !show; $('app').classList.toggle('desk', show); store.set('desk', show ? '1' : '');
  if (show && !$('desk').getAttribute('src')) $('desk').src = DESK_URL;
  $('bDesk').textContent = show ? '收起屏幕' : '看它的屏幕';
}
$('bDesk').onclick = () => desk($('deskp').hidden);
$('deskClose').onclick = () => desk(false);
// ---- 新建 / 设置 ----
async function openForm(b) {
  editing = b || null;
  $('dTitle').textContent = b ? '设置：' + b.name : '新建 Bot';
  $('fName').value = b ? b.name : ''; $('fPersona').value = b ? b.persona : ''; $('dErr').textContent = '';
  $('dDel').hidden = $('dMem').hidden = !b;
  $('dlg').showModal();
  try { if (!models.length) models = (await call('GET', '/models')).models; } catch (e) { $('dErr').textContent = e.message; }
  $('fModel').innerHTML = models.map((m) => '<option value="' + esc(m.id) + '"' + ((b ? b.model : 'gpt-6.1-sol') === m.id ? ' selected' : '') + '>' + esc(showModel(m.id) + '　（' + m.note + '）') + '</option>').join('');
}
$('newBot').onclick = () => openForm(null);
$('bSet').onclick = () => openForm(bots.find((x) => x.id === cur));
$('dCancel').onclick = () => $('dlg').close();
$('form').onsubmit = async (e) => {
  e.preventDefault();
  try { const r = await call('POST', '/bot/save', { id: editing ? editing.id : undefined, name: $('fName').value, model: $('fModel').value, persona: $('fPersona').value }); $('dlg').close(); await loadState(); if (!editing) pick(r.id); }
  catch (err) { $('dErr').textContent = err.message; }
};
$('dDel').onclick = async () => { if (!confirm('删除"' + editing.name + '"？它的对话和长期记忆会一起删除。')) return; try { await call('POST', '/bot/delete', { bot: editing.id }); $('dlg').close(); cur = ''; await loadState(); } catch (err) { $('dErr').textContent = err.message; } };
$('dMem').onclick = async () => { if (!confirm('清空"' + editing.name + '"的长期记忆？')) return; try { await call('POST', '/memory/clear', { bot: editing.id }); $('dErr').textContent = '已清空'; } catch (err) { $('dErr').textContent = err.message; } };

(async () => { await loadState(); if (cur) loadChat(true); else paintMsgs(); if (store.get('desk') || new URLSearchParams(location.search).get('desk')) desk(true); setInterval(loadState, 3000); })();
</script>
<dialog id="extDlg" class="extdlg"><div class="dl">
  <div class="row"><h3 style="margin:0">Bot 的扩展</h3><span class="sp"></span><button type="button" id="extClose">关闭</button></div>
  <p class="extnote">Bot 缺工具、技能或 MCP 服务时会自己提交申请：先由 CEO Agent 审批（它只看会不会影响现有系统），批准后由开发者安装。所有 Bot 共用同一台电脑，所以装好的东西每个 Bot 都能用。</p>
  <div id="extBody"></div>
</div></dialog>
<style>
.extdlg{width:min(860px,96vw);max-height:90vh}
.extdlg .dl{max-height:90vh;overflow:auto}
.extnote{color:var(--sub);font-size:13px;margin:8px 0 4px}
.exth{font-size:12px;color:var(--mute,#5f6b80);margin:16px 0 6px}
.extchips{display:flex;flex-wrap:wrap;gap:6px}
.extchips span{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:1px 8px;color:var(--sub)}
.extitem{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.extitem:first-child{border-top:0}
.extitem .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.extitem small{display:block;color:var(--sub)}
.extitem details{color:var(--sub);font-size:12px;margin-top:4px}
.extitem pre{white-space:pre-wrap;margin:4px 0 0;font-size:12px}
.exttag{font-size:12px;border-radius:6px;padding:0 8px;border:1px solid var(--line);white-space:nowrap}
.exttag.ok{color:var(--ok,#34c38f);border-color:var(--ok,#34c38f)}.exttag.no{color:var(--bad,#ef5b5b);border-color:var(--bad,#ef5b5b)}.exttag.wait{color:var(--warn,#f0a53a);border-color:var(--warn,#f0a53a)}
.extcard{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:6px 0;font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.extcard small{color:var(--sub)}
</style>
<script>
// ---- 扩展：已安装的东西 + 申请记录 ----
const EXT_KIND = { tool: '工具', skill: '技能', mcp: 'MCP 服务' };
const EXT_STATE = { waiting: ['等 CEO Agent 审批', 'wait'], approved: ['已批准 · 等开发者安装', 'wait'], installing: ['开发者正在安装', 'wait'], installed: ['已安装', 'ok'], denied: ['CEO Agent 没有批准', 'no'], failed: ['没有装上', 'no'] };
const extTag = (s) => { const t = EXT_STATE[s] || [s, '']; return '<span class="exttag ' + t[1] + '">' + t[0] + '</span>'; };
const extTime = (t) => { const d = new Date(t), p = (n) => String(n).padStart(2, '0'); return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()); };
// 对话里，一次申请的结果卡片。
function extCard(x) {
  return '<div class="extcard"><b>申请' + (EXT_KIND[x.kind] || '') + '：' + esc(x.name) + '</b>' + extTag(x.state)
    + '<small>' + (x.review ? 'CEO Agent：' + esc(x.review.reason) : '') + (x.state === 'installed' || x.state === 'failed' ? '　开发者：' + esc(x.result || '') : '') + '</small></div>';
}
let extKey = '';
async function loadExt() {
  let d;
  try { const res = await fetch(API + '/toolreqs'); if (!res.ok) throw new Error(res.status); d = await res.json(); }
  catch (e) { $('extBody').innerHTML = '<p class="extnote">读不到扩展信息。</p>'; return; }
  const key = JSON.stringify(d);
  if (key === extKey) return;
  extKey = key;
  const ins = d.installed || {};
  const pk = [...new Set((ins.packages || []).flatMap((p) => (p.packages || []).map((n) => n + '（' + p.method + '）')))];
  let h = '';
  if (!d.enabled) h += '<p class="extnote" style="color:var(--warn,#f0a53a)">安装口令还没有配置，Bot 暂时不能申请扩展。</p>';
  h += '<div class="exth">已安装的技能（' + (ins.skills || []).length + '）</div>' + ((ins.skills || []).length ? (ins.skills || []).map((s) => '<div class="extitem"><div class="tx"><b>' + esc(s.name) + '</b><small>' + esc(s.description || '（没有说明）') + '</small></div><button class="danger" data-extrm="skill" data-name="' + esc(s.name) + '">移除</button></div>').join('') : '<p class="extnote">还没有。</p>');
  h += '<div class="exth">已登记的 MCP 服务（' + (ins.mcp || []).length + '）</div>' + ((ins.mcp || []).length ? (ins.mcp || []).map((m) => '<div class="extitem"><div class="tx"><b>' + esc(m.name) + '</b><small>' + esc(m.command + ' ' + (m.args || []).join(' ')) + '</small></div><button class="danger" data-extrm="mcp" data-name="' + esc(m.name) + '">移除</button></div>').join('') : '<p class="extnote">还没有。</p>');
  h += '<div class="exth">后来加装的软件包（' + pk.length + '）</div>' + (pk.length ? '<div class="extchips">' + pk.map((n) => '<span>' + esc(n) + '</span>').join('') + '</div>' : '<p class="extnote">还没有。</p>');
  h += '<div class="exth">申请记录</div>' + ((d.requests || []).length ? d.requests.map((r) => '<div class="extitem"><div class="tx"><b>' + esc(r.botName) + '</b> 申请' + (EXT_KIND[r.kind] || '') + ' <b>' + esc(r.name) + '</b>　<span style="color:var(--mute,#5f6b80);font-size:12px">' + extTime(r.createdAt) + '</span>'
    + '<small>用途：' + esc(r.purpose) + '</small>'
    + (r.review ? '<small>CEO Agent：' + esc(r.review.reason) + '</small>' : '')
    + (r.result ? '<small>开发者：' + esc(r.result) + '</small>' : '')
    + ((r.plans || []).length ? '<details><summary>安装过程（' + r.plans.length + ' 次）</summary>' + r.plans.map((p, i) => '<pre>第 ' + (i + 1) + ' 次 · ' + esc(p.method) + ' ' + esc((p.packages || []).join(' ') || p.name || '') + (p.repo ? ' ← ' + esc(p.repo + '/' + (p.path || '')) : '') + (p.command ? ' ← ' + esc(p.command + ' ' + (p.args || []).join(' ')) : '') + ' · ' + (p.ok ? '成功' : '失败') + String.fromCharCode(10) + esc(p.log || '') + '</pre>').join('') + '</details>' : '')
    + '</div>' + extTag(r.state) + '</div>').join('') : '<p class="extnote">还没有 Bot 申请过。</p>');
  $('extBody').innerHTML = h;
}
$('bExt').onclick = () => { extKey = ''; loadExt(); $('extDlg').showModal(); };
$('extClose').onclick = () => $('extDlg').close();
$('extBody').addEventListener('click', async (e) => {
  const b = e.target.closest('[data-extrm]');
  if (!b) return;
  if (!confirm('移除「' + b.dataset.name + '」？移除后 Bot 就不能再用它了。')) return;
  try {
    const res = await fetch(API + '/ext/remove', { method: 'POST', headers: { 'X-Bots-Action': '1', 'Content-Type': 'application/json' }, body: JSON.stringify({ kind: b.dataset.extrm, name: b.dataset.name }) });
    if (!res.ok) throw new Error(((await res.json().catch(() => ({}))).error) || '移除失败');
    extKey = ''; loadExt();
  } catch (err) { alert(err.message); }
});
setInterval(() => { if ($('extDlg').open) loadExt(); }, 3000);
</script>
</body>
</html>
